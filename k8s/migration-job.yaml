# 스키마 생성. ArgoCD가 동기화 전에 한 번 돌립니다(PreSync 훅).
#
# drizzle-kit은 devDependency라 standalone 런타임 이미지에 없습니다. 그래서
# 마이그레이션 SQL을 ConfigMap으로 넣고 psql로 직접 적용합니다.
#
# SQL 본문은 drizzle/0000_daily_maverick.sql 과 같아야 합니다. 새 마이그레이션을
# 만들면(`npm run db:generate`) 이 ConfigMap에도 파일을 추가하세요.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kbo-migrations
  namespace: kbo
  annotations:
    # 훅 Job보다 먼저 만들어져야 마운트할 수 있습니다.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
data:
  0000_daily_maverick.sql: |
    CREATE SCHEMA "kbo_magic";
    --> statement-breakpoint
    CREATE TABLE "kbo_magic"."games" (
    	"id" text PRIMARY KEY NOT NULL,
    	"season" integer NOT NULL,
    	"game_date" date NOT NULL,
    	"game_time" text NOT NULL,
    	"away_team" text NOT NULL,
    	"home_team" text NOT NULL,
    	"away_score" integer,
    	"home_score" integer,
    	"stadium" text NOT NULL,
    	"status" text NOT NULL,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL
    );
    --> statement-breakpoint
    CREATE TABLE "kbo_magic"."standings_snapshots" (
    	"recorded_at" timestamp with time zone NOT NULL,
    	"season" integer NOT NULL,
    	"team" text NOT NULL,
    	"rank" integer NOT NULL,
    	"games" integer NOT NULL,
    	"wins" integer NOT NULL,
    	"losses" integer NOT NULL,
    	"draws" integer NOT NULL,
    	"win_rate" numeric(5, 4) NOT NULL,
    	"games_behind" numeric(4, 1),
    	"streak" text NOT NULL,
    	CONSTRAINT "standings_snapshots_recorded_at_team_pk" PRIMARY KEY("recorded_at","team")
    );
    --> statement-breakpoint
    CREATE TABLE "kbo_magic"."sync_runs" (
    	"id" integer PRIMARY KEY GENERATED ALWAYS AS IDENTITY (sequence name "kbo_magic"."sync_runs_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 2147483647 START WITH 1 CACHE 1),
    	"started_at" timestamp with time zone DEFAULT now() NOT NULL,
    	"finished_at" timestamp with time zone,
    	"status" text NOT NULL,
    	"message" text
    );
    --> statement-breakpoint
    CREATE TABLE "kbo_magic"."teams" (
    	"code" text PRIMARY KEY NOT NULL,
    	"name" text NOT NULL,
    	"color" text,
    	"updated_at" timestamp with time zone DEFAULT now() NOT NULL
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kbo-migrate
  namespace: kbo
  annotations:
    argocd.argoproj.io/hook: PreSync
    # 다음 동기화 때 같은 이름으로 다시 만들 수 있게 먼저 지웁니다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # 끝난 Job을 하루 뒤에 치웁니다.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # alpine 이미지의 postgres 사용자
        runAsGroup: 70
      containers:
        - name: migrate
          image: postgres:18-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
            - name: PGHOST
              value: postgres.database.svc.cluster.local
            - name: PGUSER
              value: iair
            - name: PGDATABASE
              value: iair
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
          command: ["/bin/sh", "-c"]
          args:
            # drizzle SQL은 CREATE TABLE에 IF NOT EXISTS가 없어 두 번 돌면 실패합니다.
            # 스키마가 이미 있으면 건너뛰어 훅이 매번 안전하게 돌게 합니다.
            - |
              set -eu
              if [ "$(psql -tAc "SELECT 1 FROM information_schema.schemata WHERE schema_name='kbo_magic'")" = "1" ]; then
                echo "kbo_magic 스키마가 이미 있습니다. 건너뜁니다."
                exit 0
              fi
              echo "마이그레이션을 적용합니다."
              for f in /sql/*.sql; do
                echo "  $f"
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "완료."
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
      volumes:
        - name: sql
          configMap: {name: kbo-migrations}

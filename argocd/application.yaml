# ArgoCD에 이 저장소를 등록합니다. 한 번만 손으로 적용합니다:
#   kubectl apply -f argocd/application.yaml
#
# private 저장소라 계정 전체용 자격증명(argocd/repo-iair-dev)이 먼저 등록돼
# 있어야 합니다. infra/oracle/registry/README.md 참고.
#
# 이 파일은 동기화 대상(path: k8s) 밖에 둡니다. 안에 두면 ArgoCD가
# 자기 자신을 관리하게 돼 prune 동작이 헷갈립니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbo-magic-number
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:iair-dev/kbo-magic-number.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kbo
  syncPolicy:
    automated:
      prune: true         # Git에서 지운 리소스는 클러스터에서도 삭제
      selfHeal: true      # 수동 변경을 Git 상태로 되돌림
    syncOptions:
      - CreateNamespace=true
